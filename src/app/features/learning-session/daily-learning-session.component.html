<div class="ls-root">
<div class="noise" aria-hidden="true"></div>

<app-sidebar>
  <main class="main">
    <div class="main-mesh" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

    <header class="topbar" [class.scrolled]="scrolled()">
      <button class="hamburger" type="button" aria-label="Open menu" (click)="openDrawer()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="crumb">
        <a class="root" routerLink="/roadmap">Athena</a><span class="sep">›</span>
        <a class="root" routerLink="/roadmap">Roadmap</a><span class="sep">›</span>
        <b>{{ session()?.title || 'Learning Session' }}</b>
      </div>
      <div class="topbar-spacer"></div>
      <a class="btn btn-glass btn-sm" routerLink="/roadmap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Roadmap
      </a>
      <app-lang-select></app-lang-select><app-theme-toggle></app-theme-toggle><button class="icon-btn" type="button" aria-label="Notifications">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
    </header>

    <div class="content">
      @if (loading()) {
        <app-athena-loader title="Preparing your lesson" [sub]="loadingText()" />
      } @else if (error()) {
        <app-empty-state [title]="'Something went wrong'" [message]="error()!" [showRetry]="true" (retry)="load()" />
      } @else if (!session()) {
        <app-empty-state
          title="No session yet"
          message="Athena hasn't prepared this lesson yet. Refresh in a moment."
          [showRetry]="true" retryLabel="Prepare now" (retry)="prepare()" />
      } @else {
        <app-learning-session-header
          [title]="session()!.title" [pct]="pct()" [statusText]="statusText()"
          [totalLabel]="totalLabel()" [leftLabel]="leftLabel()" [ctaLabel]="ctaLabel()" (cta)="onCta()" />

        <app-learning-stage-progress
          [active]="activeStage()" [done]="stagesDone()" [metas]="metas()" (select)="selectStage($event)" />

        <app-reading-section
          [readings]="session()!.readings" [active]="activeStage() === 0" (complete)="completeStage(0)" />

        <app-watching-section
          [watchings]="session()!.watchings" [active]="activeStage() === 1"
          (complete)="completeStage(1)" (back)="back(1)" />

        <app-practice-section
          [practices]="session()!.practices" [active]="activeStage() === 2"
          (complete)="completeStage(2)" (back)="back(2)" />

        <app-quiz-section
          [quizzes]="session()!.quizzes" [active]="activeStage() === 3" (complete)="completeStage(3)" />
      }
    </div>
  </main>
</app-sidebar>

<app-completion-section
  [show]="showCompletion()" [minutes]="totalMinutes()"
  (returnRoadmap)="onReturnRoadmap()" (continueTomorrow)="onContinueTomorrow()" />

<div class="toast" [class.show]="toast().show" role="status" aria-live="polite">
  <span class="ti"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
  <span><b>{{ toast().title }}</b><span>{{ toast().sub }}</span></span>
</div>
</div>
